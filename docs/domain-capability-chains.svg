<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end business services and capabilities by domain</title>
  <desc id="desc">Three vertical columns for FOREX trade processing, healthcare provider, and eCommerce. Each column is a capability chain from top to bottom.</desc>
  <style>
    .canvas { fill: #ffffff; }
    .rule { stroke: #d0d7de; stroke-width: 1.5; }
    .spine { stroke: #8c959f; stroke-width: 2; }
    .head { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
    .step { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .sub { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .h1 { fill: #1f4e79; }
    .h2 { fill: #1b4f4a; }
    .h3 { fill: #5c3d1e; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0d1117; }
      .rule { stroke: #3d444d; }
      .spine { stroke: #656c76; }
      .step { fill: #e6edf3; }
      .sub { fill: #9198a1; }
      .box { fill: #161b22; stroke: #3d444d; }
      .h1 { fill: #388bfd; }
      .h2 { fill: #3fb950; }
      .h3 { fill: #d29922; }
    }
  </style>

  <rect class="canvas" width="1080" height="520"/>

  <line class="rule" x1="360" y1="16" x2="360" y2="504"/>
  <line class="rule" x1="720" y1="16" x2="720" y2="504"/>

  <rect class="h1" x="24" y="20" width="312" height="36" rx="4"/>
  <text class="head" x="180" y="43" text-anchor="middle">FOREX trade processing</text>

  <rect class="h2" x="384" y="20" width="312" height="36" rx="4"/>
  <text class="head" x="540" y="43" text-anchor="middle">Healthcare provider</text>

  <rect class="h3" x="744" y="20" width="312" height="36" rx="4"/>
  <text class="head" x="900" y="43" text-anchor="middle">eCommerce</text>

  <line class="spine" x1="180" y1="72" x2="180" y2="492"/>
  <line class="spine" x1="540" y1="72" x2="540" y2="492"/>
  <line class="spine" x1="900" y1="72" x2="900" y2="424"/>

  <!-- row 1 -->
  <rect class="box" x="40" y="80" width="280" height="52" rx="4"/>
  <text class="step" x="180" y="111" text-anchor="middle">Trades</text>
  <rect class="box" x="400" y="80" width="280" height="52" rx="4"/>
  <text class="step" x="540" y="111" text-anchor="middle">Encounters and clinical orders</text>
  <rect class="box" x="760" y="80" width="280" height="52" rx="4"/>
  <text class="step" x="900" y="111" text-anchor="middle">Orders</text>

  <!-- row 2 -->
  <rect class="box" x="40" y="148" width="280" height="52" rx="4"/>
  <text class="step" x="180" y="179" text-anchor="middle">Execution and matching</text>
  <rect class="box" x="400" y="148" width="280" height="52" rx="4"/>
  <text class="step" x="540" y="179" text-anchor="middle">Fulfillment of care</text>
  <rect class="box" x="760" y="148" width="280" height="52" rx="4"/>
  <text class="step" x="900" y="179" text-anchor="middle">Fulfillment</text>

  <!-- row 3 -->
  <rect class="box" x="40" y="216" width="280" height="52" rx="4"/>
  <text class="step" x="180" y="247" text-anchor="middle">Reconciliation</text>
  <rect class="box" x="400" y="216" width="280" height="52" rx="4"/>
  <text class="step" x="540" y="238" text-anchor="middle">Reconciliation</text>
  <text class="sub" x="540" y="255" text-anchor="middle">eligibility · orders-to-results · meds</text>
  <rect class="box" x="760" y="216" width="280" height="52" rx="4"/>
  <text class="step" x="900" y="247" text-anchor="middle">Activation</text>

  <!-- row 4 -->
  <rect class="box" x="40" y="284" width="280" height="52" rx="4"/>
  <text class="step" x="180" y="315" text-anchor="middle">Trade-book positions</text>
  <rect class="box" x="400" y="284" width="280" height="52" rx="4"/>
  <text class="step" x="540" y="315" text-anchor="middle">Census and care-panel</text>
  <rect class="box" x="760" y="284" width="280" height="52" rx="4"/>
  <text class="step" x="900" y="315" text-anchor="middle">Notification</text>

  <!-- row 5 -->
  <rect class="box" x="40" y="352" width="280" height="52" rx="4"/>
  <text class="step" x="180" y="383" text-anchor="middle">Inter-bank integration (EDA)</text>
  <rect class="box" x="400" y="352" width="280" height="52" rx="4"/>
  <text class="step" x="540" y="383" text-anchor="middle">HIE · labs · pharmacy EDA</text>
  <rect class="box" x="760" y="352" width="280" height="52" rx="4"/>
  <text class="step" x="900" y="383" text-anchor="middle">Billing</text>

  <!-- row 6 -->
  <rect class="box" x="40" y="420" width="280" height="56" rx="4"/>
  <text class="step" x="180" y="443" text-anchor="middle">P/L calculation accuracy</text>
  <text class="sub" x="180" y="462" text-anchor="middle">intra-day · mid-day · end-of-day</text>
  <rect class="box" x="400" y="420" width="280" height="56" rx="4"/>
  <text class="step" x="540" y="443" text-anchor="middle">Utilization / case-mix</text>
  <text class="sub" x="540" y="462" text-anchor="middle">intra-day · mid-day · end-of-day</text>
</svg>
